add_newline = true
command_timeout = 200
format = "$directory$git_branch$git_status$python$cmd_duration$character"

[character]
success_symbol = "[❯](bold #cba6f7)"
error_symbol   = "[❯](bold #f38ba8)"

[directory]
style             = "bold #cba6f7"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style   = "bold #89b4fa"
repo_root_format  = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style  = "italic #89b4fa"

[git_status]
format     = "[$all_status]($style)"
style      = "#a6e3a1"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[python]
format            = "[${symbol}(${version} )(\\($virtualenv\\) )]($style)"
symbol            = " "
style             = "#f9e2af"
detect_files      = ["requirements.txt", "pyproject.toml", ".python-version"]
detect_extensions = ["py"]

[cmd_duration]
min_time = 2000
format   = "[$duration]($style) "
style    = "#6c7086"
